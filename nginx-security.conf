add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; frame-ancestors 'none';" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location ~ ^/storage/ { deny all; return 403; }
location ~ \.db$ { deny all; return 403; }
location ~ \.sql$ { deny all; return 403; }
location = /install.php { deny all; return 403; }
location ~ /\. { deny all; return 403; }
client_max_body_size 1m;
